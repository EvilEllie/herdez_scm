<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Herdez SCM</title>
<link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
<div class="login-fondo">
  <div class="login">
    <div class="marca"><span class="logo">H</span><b>Herdez SCM</b></div>
    <h1>Iniciar sesión</h1>
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for categoria, texto in mensajes %}
        <div class="mensaje {{ categoria }}" style="margin-top:14px">{{ texto }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <div class="campo"><label for="correo">Correo</label><input id="correo" name="correo" type="email" value="{{ correo }}" required autofocus></div>
      <div class="campo"><label for="contrasena">Contraseña</label><input id="contrasena" name="contrasena" type="password" required></div>
      <button class="boton" type="submit">Entrar</button>
    </form>
  </div>
</div>
</body>
</html>
