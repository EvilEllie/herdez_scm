{% extends 'base.html' %}
{% block titulo %}Editar usuario{% endblock %}
{% block contenido %}
<div class="encabezado">
  <div><h1>Editar usuario</h1><p class="subtitulo">{{ persona['correo'] }}</p></div>
  <a class="boton secundario" href="{{ url_for('usuarios.inicio') }}">Regresar</a>
</div>
<div class="tarjeta">
  <form method="post" class="formulario">
    <div class="campo"><label>Nombre</label><input name="nombre" value="{{ persona['nombre'] }}" required></div>
    <div class="campo"><label>Rol</label>
      <select name="rol">{% for clave in roles %}<option value="{{ clave }}" {% if clave == persona['rol'] %}selected{% endif %}>{{ roles[clave] }}</option>{% endfor %}</select></div>
    <div class="campo"><label>Sede</label>
      <select name="sede_id">{% for s in sedes %}<option value="{{ s['id'] }}" {% if s['id'] == persona['sede_id'] %}selected{% endif %}>{{ s['nombre'] }}</option>{% endfor %}</select></div>
    <div class="campo"><label>Nueva contraseña (opcional)</label><input type="password" name="contrasena" placeholder="Dejar vacío para no cambiar"></div>
    <button class="boton">Guardar cambios</button>
  </form>
</div>
{% endblock %}
